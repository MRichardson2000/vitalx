[project]
name = "vitalx"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dash>=4.4.0",
    "dash-ag-grid>=35.2.0",
    "logger>=0.2.0",
    "numpy>=2.2.6",
    "openmeteo-requests>=1.7.5",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pre-commit>=4.6.2",
    "prek>=0.4.14",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "requests-cache>=1.3.3",
    "retry-requests>=2.0.0",
    "sqlalchemy>=2.0.51",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.12",
    "ty>=0.0.33",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vitalx"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ty.rules]
unused-type-ignore-comment = "ignore"
